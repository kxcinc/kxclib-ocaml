name: Common CI workflow

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          # todo.later - unpin back to ubuntu-latest once OCaml builds are
          #              confirmed stable on Ubuntu 26 runners
          # OCaml (setup-ocaml) runs directly on the runner; pin to 24.04 to avoid
          # known issues with OCaml on Ubuntu 26 as ubuntu-latest migrates to it.
          # cf. https://discuss.ocaml.org/t/error-139-when-building-ocaml-5-5-0-on-ubuntu-26-04/18310
          - ubuntu-24.04
        ocaml-version:
          - 5.1.x
          - 5.3.x
          - 5.4.x
          - 5.5.x
        node-version:
          - lts/hydrogen # v18 Active LTS
        oven-version:
          - latest
          - 1.1.29

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 2

      - name: Use OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: 'melange/yarn.lock'

      - uses: oven-sh/setup-bun@v2
        id: setup-bun
        with:
          bun-version: ${{ matrix.oven-version }}

      - name: add path
        run: dirname "${{ steps.setup-bun.outputs.bun-path }}" >> $GITHUB_PATH

      - name: Cache OPAM switch
        id: cache-switch
        uses: actions/cache@v4
        with:
          path: _opam
          key: v1-${{ runner.os }}-${{ matrix.ocaml-version }}-${{ hashFiles('**.opam') }}-opam-switch

      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-doc

      - name: build
        run: opam exec -- dune build

      - name: doc
        run: opam exec -- dune build @doc

      - name: test
        run: opam exec -- dune runtest
