name: OCaml General

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  quick-check:
    strategy:
      fail-fast: false
      matrix:
        ocaml-version:
          - 4.14.2
          - 5.1.1
          - 5.3.0
        oven-version:
          - v1.1.29
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 2

      - name: OCaml Checks
        uses: kxcdev/ocaml-general-gha@v3
        with:
          ocaml-version: ${{ matrix.ocaml-version }}
          node-version: 'latest'
          pr-report-test-result: ${{ matrix.ocaml-version == '5.3.0' }}
          # https://bun.sh/docs/installation
          # GIT_CONFIG_*: opam 2.6.0 runs git with GIT_CONFIG_GLOBAL=/dev/null, ignoring the
          # safe.directory set up by the container entrypoint; passing it via GIT_CONFIG_* env
          # vars survives (opam keeps pre-existing entries). cf. ocaml/opam#6963
          setup-command: |
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
            curl -fsSL https://bun.sh/install | bash -s "bun-${{ matrix.oven-version }}"
            opam install . --yes --deps-only --with-test --verbose
          test-command: |
            export BUN_INSTALL="$HOME/.bun"
            export PATH=$BUN_INSTALL/bin:$PATH
            dune runtest

  quick-check-finished:
    needs: quick-check
    runs-on: ubuntu-latest
    steps:
      - run: echo "all set"

  odoc-github-pages:

    needs: quick-check-finished

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    environment:
      name: github-pages

      ## waiting for resolution of actions/runner#2009
      #url: ${{ steps.camlbuild.outputs.odoc-github-pages-url }}
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 2

      - name: Build odoc document
        id: camlbuild
        uses: kxcdev/ocaml-general-gha@v3
        with:
          ocaml-version: '5.3.0'

          # same opam 2.6.0 workaround as the quick-check job above
          setup-command: |
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
            opam install . --yes --deps-only --with-test --verbose

          skip-testing: true
          report-test-result: false

          with-odoc: true
          odoc-upload-artifact: true
          odoc-upload-artifact-name: "github-pages"

          ## waiting for resolution of actions/runner#2009
          # odoc-deploy-github-pages: true

      - name: Setup Pages
        if: ${{ inputs.odoc-deploy-github-pages }}
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
